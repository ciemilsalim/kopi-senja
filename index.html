<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kopi Senja</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
  <style>
    :root { --bg: #1b1410; --card: #2a201a; --accent: #f2a65a; --text: #f5ede6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .hero { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 2rem;
            background: radial-gradient(circle at 50% 30%, #4a2f1e, var(--bg) 70%); }
    .hero h1 { font-size: clamp(2.5rem, 7vw, 5rem); }
    .hero p { opacity: .8; margin: 1rem 0 2rem; }
    .btn { background: var(--accent); color: var(--bg); padding: .9rem 2rem; border-radius: 999px;
           text-decoration: none; font-weight: 700; border: 0; font-size: 1rem; cursor: pointer; }
    .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem; max-width: 960px; margin: 3rem auto; padding: 0 1.5rem; }
    .item { background: var(--card); border-radius: 16px; padding: 1.5rem; }
    .item h3 { color: var(--accent); }
    .item.habis { opacity: .5; }
    .order { width: calc(100% - 3rem); max-width: 560px; margin: 0 auto 4rem; padding: 2rem; background: var(--card); border-radius: 16px; }
    .order h2 { color: var(--accent); margin-bottom: 1.2rem; }
    .order label { display: block; margin: 1rem 0 .4rem; opacity: .85; }
    .order input, .order select { width: 100%; padding: .8rem; border-radius: 10px; border: 1px solid #5a4636;
                                  background: var(--bg); color: var(--text); font-size: 1rem; }
    .total { margin: 1.4rem 0; font-size: 1.3rem; font-weight: 700; }
    .hero .status { display: table; margin: -1rem auto 2rem; padding: .4rem 1rem; border-radius: 999px; background: var(--card); font-weight: 700; }
    .error { color: var(--accent); min-height: 1.2rem; margin-top: .4rem; }
    .demo-bar { text-align: center; padding: 1.2rem 1rem 2rem; font-size: .9rem; opacity: .8; }
    .demo-bar a { color: var(--accent); }
  </style>
</head>
<body>
  <section class="hero">
    <div>
      <h1>Kopi Senja</h1>
      <p>Kopi lokal, diseduh pelan untuk sore yang tenang.</p>
      <p class="status" id="status"></p>
      <a class="btn" href="#pesan">Pesan Sekarang</a>
    </div>
  </section>
  <section class="menu">
    <div class="item"><h3>Kopi Susu Aren</h3><p>Rp18.000</p></div>
    <div class="item"><h3>V60 Gayo</h3><p>Rp27.000</p></div>
    <div class="item habis"><h3>Es Kopi Pandan</h3><p>Habis</p></div>
  </section>
  <form class="order" id="pesan">
    <h2>Form Pesan</h2>
    <label for="nama">Nama</label>
    <input id="nama" placeholder="Nama kamu">
    <div class="error" id="err"></div>
    <label for="menu">Menu</label>
    <select id="menu">
      <option value="18000">Kopi Susu Aren</option>
      <option value="27000">V60 Gayo</option>
      <option value="20000" disabled>Es Kopi Pandan (habis)</option>
    </select>
    <label for="jumlah">Jumlah</label>
    <input id="jumlah" type="number" min="1" max="10" value="1">
    <div class="total">Total: <span id="total">Rp18.000</span></div>
    <button class="btn" type="submit">Kirim ke WhatsApp</button>
  </form>
  <script src="harga.js"></script>
  <script src="jam.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const rupiah = n => 'Rp' + n.toLocaleString('id-ID');
    function hitung() {
      const qty = Math.min(10, Math.max(1, +$('jumlah').value || 1));
      const total = hitungTotal(+$('menu').value, qty);
      $('total').textContent = rupiah(total);
      return qty;
    }
    const now = new Date();
    const buka = statusBuka(now.getHours(), now.getMinutes()) === 'Buka';
    $('status').textContent = (buka ? '● Buka sekarang' : '● Sedang tutup') + ' · 08.00–22.00';
    $('menu').onchange = $('jumlah').oninput = hitung;
    $('pesan').onsubmit = e => {
      e.preventDefault();
      const nama = $('nama').value.trim();
      if (!nama) { $('err').textContent = 'Nama wajib diisi'; return; }
      $('err').textContent = '';
      const menu = $('menu').selectedOptions[0].text;
      const pesan = `Halo Kopi Senja, saya ${nama} pesan ${hitung()} ${menu}.`;
      window.open('https://wa.me/?text=' + encodeURIComponent(pesan));
    };
  </script>
  <p class="demo-bar">Kedai fiktif — demo seri <a href="seri.html">Ngoding Bareng AI Agent</a>. Tombol pesan membuka WhatsApp tanpa nomor tujuan.</p>
</body>
</html>
